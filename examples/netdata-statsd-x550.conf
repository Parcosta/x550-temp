# /etc/netdata/statsd.d/x550.conf
# Feed it with: x550-temp --statsd 127.0.0.1:8125   (e.g. from a 1-minute systemd timer)
# Replace 0000_05_00 with your chip's PCI address as printed by x550-temp (":" and "." become "_").
[app]
    name = x550
    metrics = x550.*
    private charts = no
    gaps when not collected = yes

[temperature]
    name = temperature
    title = Intel X550 die temperature (PHY 1E.C820)
    family = network card
    context = x550.temperature
    units = Celsius
    type = line
    dimension = x550.0000_05_00.temperature die last 1 1
