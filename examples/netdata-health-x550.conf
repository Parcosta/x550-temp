# /etc/netdata/health.d/x550.conf
 template: x550_temperature
       on: x550.temperature
   lookup: average -5m unaligned
    units: Celsius
    every: 1m
     warn: $this > 85
     crit: $this > 95
     info: Intel X550 die temperature, 5 minute average (Tj max 105 C; the PHY shuts down at 107 C)
       to: sysadmin

 template: x550_temperature_stale
       on: x550.temperature
     calc: $now - $last_collected_t
    units: seconds ago
    every: 1m
     warn: $this > 600
     info: Seconds since the X550 temperature was last received
       to: sysadmin
